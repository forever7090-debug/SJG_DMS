<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJG DMS</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            SJG
        </div>

        <ul class="menu">
            <li class="active">통합 모니터링</li>
            <li>생산관리</li>
            <li>자재관리</li>
            <li>물류관리</li>
            <li>고객사 현황</li>
            <li id="openInput">데이터 입력</li>
            <li>AI 분석결과</li>
            <li>보고서</li>
            <li>설정</li>
        </ul>

    </aside>

    <main class="content">

        <div class="header">

            <div class="filter-area">
                <label>기준주차</label>

                <select id="weekSelect">
                    <option>2026-W45</option>
                </select>
            </div>

            <div id="lastUpdate">
                최종 업데이트
            </div>

        </div>

        <div class="kpi-row">

            <div class="kpi-card">
                <h4>고객사 계획수량</h4>
                <h2 id="customerPlan">0</h2>
            </div>

            <div class="kpi-card">
                <h4>생산 계획수량</h4>
                <h2 id="productionPlan">0</h2>
            </div>

            <div class="kpi-card">
                <h4>자재 소요량</h4>
                <h2 id="materialQty">0</h2>
            </div>

            <div class="kpi-card">
                <h4>출하 계획수량</h4>
                <h2 id="shipmentPlan">0</h2>
            </div>

            <div class="kpi-card issue">
                <h4>특이사항</h4>
                <h2 id="issueCount">0건</h2>
            </div>

        </div>

        <section class="panel">
            <div class="panel-title">
                생산관리 현황
            </div>

            <canvas id="productionChart"></canvas>
        </section>

        <section class="panel">

            <div class="panel-title">
                자재관리 현황
            </div>

            <table>
                <thead>
                    <tr>
                        <th>구분</th>
                        <th>소요량</th>
                        <th>재고</th>
                        <th>입고예정</th>
                    </tr>
                </thead>

                <tbody id="materialTable"></tbody>
            </table>

        </section>

        <section class="panel">

            <div class="panel-title">
                AI 종합 분석
            </div>

            <div id="analysisResult"></div>

        </section>

    </main>

</div>

<div id="inputModal" class="modal">

    <div class="modal-body">

        <h2>주간 데이터 입력</h2>

        <input id="week" placeholder="2026-W45">

        <input id="customer" placeholder="고객사 계획">

        <input id="production_plan" placeholder="생산 계획">

        <input id="production_actual" placeholder="생산 실적">

        <input id="shipment_plan" placeholder="출하 계획">

        <input id="shipment_actual" placeholder="출하 실적">

        <input id="material_required" placeholder="자재 소요량">

        <button onclick="saveData()">저장</button>

    </div>

</div>

<script src="js/storage.js"></script>
<script src="js/analysis.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
